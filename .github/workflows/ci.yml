name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: ruff check .
      - name: Run tests
        run: python -m pytest
